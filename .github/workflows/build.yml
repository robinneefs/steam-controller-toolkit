# Release bundles for Windows, macOS and Linux.
# Each OS gets a portable build (runs without installing) and the usual installers.
# - Run it by hand (Actions > Build > Run workflow): both are attached to the run as artifacts.
# - Push a tag like v0.1.0: they also go into a draft GitHub release for that tag.
name: Build

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write # tauri-action creates the draft release

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            os: windows-latest
            args: ""
          - name: macos
            os: macos-latest
            args: "--target universal-apple-darwin" # one .app/.dmg for Apple silicon and Intel
          - name: linux
            os: ubuntu-22.04 # oldest supported glibc, so the AppImage/.deb run on more distros
            args: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          # webkit/appindicator/rsvg for Tauri; libudev for hidapi's hidraw backend
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libudev-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.name == 'macos' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        id: tauri
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: ${{ matrix.args }}
          # Only set on tag pushes; on manual runs nothing is released.
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: Steam Controller Toolkit ${{ github.ref_name }}
          releaseBody: See the assets below to download and install.
          releaseDraft: true

      # Versions that run without installing: the bare .exe (the frontend is embedded in it;
      # WebView2 ships with Windows 10/11), the .app zipped, and the AppImage.
      - name: Make portable builds
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          mkdir portable
          case "${{ matrix.name }}" in
            windows)
              cp target/release/steam-controller-app.exe "portable/Steam-Controller-Toolkit_${version}_x64_portable.exe" ;;
            macos)
              ditto -c -k --keepParent "target/universal-apple-darwin/release/bundle/macos/Steam Controller Toolkit.app" \
                "portable/Steam-Controller-Toolkit_${version}_macos_universal.zip" ;;
            linux)
              cp target/release/bundle/appimage/*.AppImage "portable/Steam-Controller-Toolkit_${version}_amd64.AppImage"
              chmod +x portable/*.AppImage ;;
          esac
          ls -la portable

      - name: Attach portable builds to the release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for f in portable/*; do
            gh api -X POST -H "Content-Type: application/octet-stream" --input "$f" \
              "https://uploads.github.com/repos/${{ github.repository }}/releases/${{ steps.tauri.outputs.releaseId }}/assets?name=$(basename "$f")"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: steam-controller-toolkit-${{ matrix.name }}-portable
          path: portable/*
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: steam-controller-toolkit-${{ matrix.name }}-installers
          path: |
            target/**/release/bundle/msi/*.msi
            target/**/release/bundle/nsis/*.exe
            target/**/release/bundle/dmg/*.dmg
            target/**/release/bundle/deb/*.deb
            target/**/release/bundle/rpm/*.rpm
          if-no-files-found: error
