[package]
name = "steam-controller-app"
version = "0.2.1"
description = "Steam Controller toolkit: live input visualizer and more"
authors = ["GGenie"]
edition = "2024"

[lib]
# The `_lib` suffix avoids a lib/bin name clash on Windows: https://github.com/rust-lang/cargo/issues/8519
name = "steam_controller_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
sc-core = { path = "../crates/sc-core" }
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = { version = "0.39.6", default-features = false, features = ["system"] }
tauri-plugin-opener = "2"
# Tray mode: a second launch opens the running app's window; start with the system, in the tray.
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
midir = "0.11"
rosc = "0.11"

# Windows MIDI Services (our own virtual MIDI port on Windows 11 25H2+): runtime for the
# generated bindings in src/midi2_bindings.rs (tools/midi2-bindings).
[target.'cfg(windows)'.dependencies]
windows-core = "0.100"
windows-collections = "0.100"
# Keyboard & mouse output (SendInput), full-screen detection, running the driver installer.
windows-sys = { version = "0.61", features = [
    "Win32_Foundation", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi", "Win32_System_Threading", "Win32_UI_Shell",
] }
# Gamepad output: a virtual Xbox 360 controller through the ViGEmBus driver, rumble included.
vigem-client = { version = "0.1.4", features = ["unstable_xtarget_notification"] }

# Keyboard & mouse and Gamepad output on Linux: virtual devices through uinput.
[target.'cfg(target_os = "linux")'.dependencies]
evdev = "0.13"
