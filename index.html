<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/styles.css" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Steam Controller Toolkit</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>
  <body>
    <header class="topbar">
      <div class="brand"><img src="/logo.png" alt="" /><span>Steam Controller Toolkit</span></div>
      <nav id="tabs" class="tabs"></nav>
      <div id="status" class="status">Searching for controller…</div>
    </header>
    <div id="steam-warning" class="banner" hidden>
      <span>
        <b>Steam is running.</b> Its Desktop Layout turns the controller into a mouse and keyboard while
        this app is open. To stop that, close Steam, or remove the bindings in Steam → Settings →
        Controller → Desktop Layout.
      </span>
      <button data-dismiss title="Hide until Steam is restarted">×</button>
    </div>
    <main id="tab-content"></main>
  </body>
</html>
